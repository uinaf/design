<!doctype html>
<!-- @page name="login" description="Auth page: centered corner-tick panel, OAuth-only sign-in (github, optional google), dry copy. No marketing, no kicker." -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uinaf — login</title>
    <link rel="stylesheet" href="../dist/css/tokens.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg);
      }
      @keyframes ue {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        [style*="animation"] {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body class="uinaf">
    <div
      class="uinaf"
      style="min-height: 100vh; display: grid; place-items: center; padding: var(--sp-6)"
    >
      <div
        style="
          width: 100%;
          max-width: 360px;
          display: flex;
          flex-direction: column;
          gap: var(--sp-4);
          animation: ue 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
        "
      >
        <div
          class="u-panel u-ticks"
          style="padding: var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-6)"
        >
          <a href="#" class="u-topbar-mark"
            ><img
              src="https://cdn.uinaf.dev/images/uinaf-computer.png"
              alt="slopzapper mark"
            />slopzapper</a
          >
          <div style="display: flex; flex-direction: column; gap: var(--sp-2)">
            <h2 style="font-size: 16px">sign in</h2>
            <p style="font-size: 13px">reviews wait for no one. they do, actually.</p>
          </div>
          <div
            style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3)"
          >
            <a class="u-btn u-btn--primary" href="#">continue with github ↗</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
