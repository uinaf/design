packages:
  - "."

# Explicit, so a too-young version fails the install instead of being exempted.
minimumReleaseAge: 1440

overrides:
  vite@*: "catalog:"
  # agents pins vulnerable MCP peers; keep overrides scoped to those pins.
  "@modelcontextprotocol/client@2.0.0": 2.3.1
  "@modelcontextprotocol/sdk@1.30.0": 1.32.1
  # The @effect/* 4.0.3 packages need effect@4.0.3 as a peer, which was inside the
  # release-age window; hold them on the root effect and drop these when bumping it.
  "@effect/platform-node-shared": 4.0.4
  "@effect/sql-d1": 4.0.4
  "@effect/sql-sqlite-do": 4.0.4
  # alchemy bundles Prisma tooling this Cloudflare-only stack never loads; lift its
  # advisories without moving the MCP SDK's own hono server.
  "@prisma/dev>hono": ^4.12.25
  "@prisma/dev>@hono/node-server": ^1.19.10
  "lodash@<4.18.1": ^4.18.1

allowBuilds:
  core-js-pure: false
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
peerDependencyRules:
  allowAny:
    - vite
  # `pnpm peers check` in verify fails on any other unmet peer, such as effect
  # trailing its @effect/* packages when a grouped update lands half-aged.
  allowedVersions:
    vite: "*"
    "agents>@modelcontextprotocol/server": "2"
    "capnp-es>typescript": "7"
