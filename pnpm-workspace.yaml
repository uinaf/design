packages:
  - "."

# Explicit, so a too-young version fails the install instead of being exempted.
minimumReleaseAge: 1440

overrides:
  vite@*: "catalog:"
  # alchemy bundles Prisma tooling this Cloudflare-only stack never loads; lift its
  # advisories.
  "@prisma/dev>hono": ^4.12.25
  "@prisma/dev>@hono/node-server": ^1.19.10
  "lodash@<4.18.1": ^4.18.1
  # GHSA-xjj6-f33q-929c: wrangler and @effect/platform-node pin vulnerable undici lines.
  "undici@>=7.18.0 <7.30.1": ^7.30.1
  "undici@>=8.0.0 <8.12.2": ^8.12.2

allowBuilds:
  core-js-pure: false
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
peerDependencyRules:
  allowAny:
    - vite
  # `pnpm peers check` in verify fails on any other unmet peer, such as effect
  # trailing its @effect/* packages when a grouped update lands half-aged.
  allowedVersions:
    vite: "*"
    "capnp-es>typescript": "7"
