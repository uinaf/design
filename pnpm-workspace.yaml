packages:
  - "."

overrides:
  vite@*: "catalog:"
  # miniflare pins undici exactly; 7.29.0 carries two high advisories. No-op once wrangler resolves undici >=7.29.1.
  undici@7.29.0: 8.11.2

allowBuilds:
  core-js-pure: false
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
