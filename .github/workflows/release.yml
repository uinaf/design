name: Release

# The file name is load-bearing. npm Trusted Publishing binds this package's
# OIDC identity to `.github/workflows/release.yml` plus the `release`
# environment. This was confirmed against the provenance attestation of a published
# version, not only against docs. Rename or move this file and `npm publish`
# fails with an identity mismatch until someone updates the trusted publisher
# on npmjs.com. So the publish job stays here, and everything else that runs on
# a push to main came to it.
#
# `deploy` and `release` are siblings, both on `needs: [verify, scan]`.
# Never make deploy `needs: [release]`. design.uinaf.dev must keep shipping
# when publication fails.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # One verify and one secret scan for both consumers. These used to live in
  # this file and in main.yml, on the same trigger, so every push to main ran
  # the whole gate twice and the two runs raced each other over one commit.
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: uinaf/.github/.github/workflows/scan.yml@main

  # A skipped dependency skips its dependents, so `[skip ci]` is declared once
  # above and reaches both of the jobs below through `needs`.
  deploy:
    needs: [verify, scan]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://design.uinaf.dev
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Deploy guide
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run deploy

      # verify proves the contract against a local worker. Only this proves it
      # against what design.uinaf.dev actually serves: the custom domain, the
      # real asset binding, and the build that just shipped.
      - name: Smoke the deployed contract
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # The contract alone would pass against the deployment this job
          # replaced, so during propagation a green result would prove nothing.
          # machine-layer.ts stamps this commit into /.well-known/build, and
          # wrangler ships the Worker and its assets as one version, so seeing
          # this SHA is proof the new Worker is the one answering.
          # Two waits, budgeted separately. Counting attempts across both put a
          # good deploy in the red: the probe returns in milliseconds while
          # propagation is pending, so a budget written as 400s spent 50.
          deadline=$(($(date +%s) + 300))
          while true; do
            served="$(curl -sf --max-time 10 https://design.uinaf.dev/.well-known/build || true)"
            if [ "$served" = "$GITHUB_SHA" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "design.uinaf.dev did not serve $GITHUB_SHA within 5m — still on ${served:-<none>}"
              exit 1
            fi
            echo "waiting for propagation: design.uinaf.dev is on ${served:-<none>}"
            sleep 10
          done

          # This build is the one answering, so a failure here is the contract's.
          for attempt in 1 2 3; do
            if timeout 60 node scripts/smoke-mcp.ts https://design.uinaf.dev; then
              exit 0
            fi
            echo "attempt $attempt: this build is live but the contract failed"
            sleep 10
          done
          echo "design.uinaf.dev serves this build, but its contract does not hold"
          exit 1

  release:
    needs: [verify, scan]
    # npm provenance requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
      deployment: false
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Publish the commit verified by this workflow, even if main advances.
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          standalone: true
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: false
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Authorize release writes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git
      - id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/npm@13.1.5
            @semantic-release/github@12.0.8
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}

      - name: Verify immutable release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)" = true
