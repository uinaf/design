name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: uinaf/.github/.github/workflows/scan.yml@5cb5234c5395e37a1c876619bbe5d7cb8938bda3 # v2.0.0

  deploy:
    needs: [verify, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://design.uinaf.dev
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Deploy guide
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run deploy

      - name: Smoke the deployed contract
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          deadline=$(($(date +%s) + 300))
          while true; do
            served="$(curl -sf --max-time 10 https://design.uinaf.dev/.well-known/build || true)"
            if [ "$served" = "$GITHUB_SHA" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "design.uinaf.dev did not serve $GITHUB_SHA within 5m — still on ${served:-<none>}"
              exit 1
            fi
            echo "waiting for propagation: design.uinaf.dev is on ${served:-<none>}"
            sleep 10
          done

          for attempt in 1 2 3; do
            if timeout 60 node scripts/smoke-mcp.ts https://design.uinaf.dev; then
              exit 0
            fi
            echo "attempt $attempt: this build is live but the contract failed"
            sleep 10
          done
          echo "design.uinaf.dev serves this build, but its contract does not hold"
          exit 1

  release:
    needs: [verify, scan]
    permissions:
      contents: read
      id-token: write
    uses: uinaf/.github/.github/workflows/release-npm.yml@168dfda80c93edc6c7085675e0982e32e2229c97 # v1.0.2
    secrets:
      UINAF_CI_APP_PRIVATE_KEY: ${{ secrets.UINAF_CI_APP_PRIVATE_KEY }}
