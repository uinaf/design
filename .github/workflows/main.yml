name: Main

# Guide deploy is independent of npm publish. Do NOT move deploy behind
# release.yml — design.uinaf.dev must keep shipping when release fails.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run verify

  secrets:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/secrets.yml

  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://design.uinaf.dev
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: false
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Deploy guide
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run deploy

      # verify proves the contract against a local worker. Only this proves it
      # against what design.uinaf.dev actually serves — the custom domain, the
      # real asset binding, and the build that just shipped.
      - name: Smoke the deployed contract
        run: |
          for attempt in 1 2 3; do
            # The script bounds each request; `timeout` bounds the process, so a
            # hang for any other reason costs 2 minutes rather than the job.
            if timeout 120 node scripts/smoke-mcp.ts https://design.uinaf.dev; then
              exit 0
            fi
            echo "attempt $attempt failed — the deploy may still be propagating"
            sleep 10
          done
          echo "design.uinaf.dev did not serve the contract after the deploy"
          exit 1
