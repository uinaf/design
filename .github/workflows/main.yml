name: Main

# Guide deploy is independent of npm publish. Do NOT move deploy behind
# release.yml — design.uinaf.dev must keep shipping when release fails.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run verify

  secrets:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/secrets.yml

  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: [verify, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://design.uinaf.dev
    concurrency:
      group: deploy-${{ github.repository }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: ".node-version"
          cache: false
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Deploy guide
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run deploy

      # verify proves the contract against a local worker. Only this proves it
      # against what design.uinaf.dev actually serves — the custom domain, the
      # real asset binding, and the build that just shipped.
      - name: Smoke the deployed contract
        run: |
          # The contract alone would pass against the deployment this job
          # replaced, so during propagation a green result would prove nothing.
          # Wait until the domain serves this build's own artifact first; when
          # the bytes are identical there is nothing to wait for.
          expected="$(shasum -a 256 guide/components.json | cut -d' ' -f1)"
          for attempt in 1 2 3 4 5 6; do
            served="$(curl -sf --max-time 20 https://design.uinaf.dev/components.json | shasum -a 256 | cut -d' ' -f1 || true)"
            if [ "$served" = "$expected" ]; then
              # The script bounds each request; `timeout` bounds the process, so
              # a hang for any other reason costs 2 minutes, not the job.
              if timeout 120 node scripts/smoke-mcp.ts https://design.uinaf.dev; then
                exit 0
              fi
              echo "attempt $attempt: this build is live but the contract failed"
            else
              echo "attempt $attempt: design.uinaf.dev is still serving another build"
            fi
            sleep 10
          done
          echo "design.uinaf.dev did not serve this build's contract after the deploy"
          exit 1
