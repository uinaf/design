name: Secret scanning

on:
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker build --target gitleaks --tag design-gitleaks:ci .github/scanners
          docker run --rm --network none -v "$PWD:/repo:ro" design-gitleaks:ci \
            detect --source /repo --redact --no-banner --log-level error

  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run trufflehog
        run: |
          docker build --target trufflehog --tag design-trufflehog:ci .github/scanners
          docker run --rm -v "$PWD:/repo:ro" design-trufflehog:ci \
            git file:///repo --no-update --fail --results=verified
