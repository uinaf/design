<!doctype html>
<!-- @dsCard group="Brand" name="Logo lockup" subtitle="Framed mark, black only, never recolored" viewport="720x520" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>uinaf — logo</title>
<link rel="stylesheet" href="../dist/css/tokens.css">
<style>
html,body{margin:0;padding:0}
body.uinaf{padding:32px 36px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
.main img{width:240px;height:240px;border:1px solid var(--neutral-900);display:block;background:#000}
.side{display:flex;flex-direction:column;gap:14px;padding-top:2px}
.side .scale{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--fg-subtle)}
.side .scale img{border:1px solid var(--neutral-900);display:block;background:#000}
.rules{font-size:11px;color:var(--fg-muted);display:flex;flex-direction:column;gap:5px;margin-top:4px}
.rules s{color:var(--fg-faint)}
</style>
</head><body class="uinaf">
<span class="u-label">logo lockup — framed mark, black only</span>
<div class="row">
  <div class="main u-ticks"><img src="https://cdn.uinaf.dev/images/uinaf-team.png" width="240" height="240" alt="uinaf primary mark"></div>
  <div class="side">
    <span class="u-label">primary · 220–240px</span>
    <div class="scale"><img src="https://cdn.uinaf.dev/images/uinaf-computer.png" width="64" height="64" alt="">64 · secondary</div>
    <div class="scale"><img src="https://cdn.uinaf.dev/images/uinaf-computer.png" width="32" height="32" alt="">32 · favicon</div>
    <div class="scale"><span style="font-size:16px;color:var(--fg)">uinaf</span>text wordmark, lowercase</div>
    <div class="rules">
      <span>✓ pure black behind, 1px frame, square crop</span>
      <span><s>✗ never rotate, recolor, or gradient-fill</s></span>
      <span><s>✗ never on a non-black background</s></span>
    </div>
  </div>
</div>
</body></html>
