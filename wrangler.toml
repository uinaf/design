name = "uinaf-design"
main = "src/worker.ts"
compatibility_date = "2025-08-01"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true
preview_urls = false

[assets]
directory = "./guide"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = [ "/mcp", "/mcp/", "/", "/*.html", "/patterns/*.html", "/preview/*.html" ]
