# Read only by `wrangler types` to generate `Env` and the runtime types.
# `alchemy.run.ts` owns deploy and dev; keep the date and flags in step with it.
name = "uinaf-design"
main = "src/worker.ts"
compatibility_date = "2025-08-01"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./guide"
binding = "ASSETS"
