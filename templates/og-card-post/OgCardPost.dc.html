<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="og card — blog post" description="1200×630 open-graph image for a post: kicker, title, site mark." -->
<helmet>
<script src="./ds-base.js"></script>
<style>body{margin:0;background:rgb(10,10,10)}</style>
</helmet>
<div class="uinaf" style="width:1200px;height:630px;position:relative;overflow:hidden;box-sizing:border-box">
<div class="u-ticks" style="position:absolute;inset:28px;border:1px solid rgb(38,38,38)"></div>
<div style="position:absolute;inset:28px;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:24px">
<span class="u-label" style="font-size:18px">writing · jul 28, 2026 · 4 mins read</span>
<span style="font-size:64px;line-height:1.25;color:rgb(229,229,229);letter-spacing:-0.01em;max-width:22ch;text-wrap:pretty">shipping a daemon nobody notices</span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="display:inline-flex;align-items:center;gap:16px"><img src="../../assets/uinaf-computer.png" alt="" style="width:48px;height:48px;border:1px solid rgb(38,38,38);display:block"><span style="font-size:22px;color:rgb(163,163,163)">uinaf.dev</span></span>
<span style="font-size:22px;color:rgb(82,82,82)">we bet you've seen us before.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630}}"></script>
</body>
</html>
