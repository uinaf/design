<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="github repo og card" description="1280×640 repo social preview: org path, repo name, one line, install." -->
<helmet>
<script src="./ds-base.js"></script>
<style>body{margin:0;background:rgb(10,10,10)}</style>
</helmet>
<div class="uinaf" style="width:1280px;height:640px;position:relative;overflow:hidden;box-sizing:border-box">
<div class="u-ticks" style="position:absolute;inset:28px;border:1px solid rgb(38,38,38)"></div>
<div style="position:absolute;inset:28px;display:flex;align-items:center;gap:72px;padding:0 88px;box-sizing:border-box">
<div style="flex:1;display:flex;flex-direction:column;gap:28px;min-width:0">
<span class="u-label" style="font-size:20px">github.com / uinaf</span>
<span style="font-size:88px;line-height:1.1;color:rgb(229,229,229);letter-spacing:-0.01em">healthd</span>
<span style="font-size:28px;line-height:1.45;color:rgb(163,163,163);max-width:24ch;text-wrap:pretty">pluggable host health check daemon in Go.</span>
<span style="display:inline-flex;align-self:flex-start;align-items:center;background:rgb(16,16,16);border:1px solid rgb(38,38,38);border-radius:2px;padding:16px 24px;font-size:24px;color:rgb(229,229,229);margin-top:8px"><span style="color:rgb(82,82,82);margin-right:16px">$</span>brew install uinaf/tap/healthd</span>
</div>
<img src="../../assets/uinaf-computer.png" alt="" style="width:340px;height:340px;border:1px solid rgb(23,23,23);flex:none;display:block">
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:640}}"></script>
</body>
</html>
