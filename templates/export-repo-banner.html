<!doctype html>
<!-- @template name="export · repo OG card" description="1280×640 repo social preview: org path, repo name, one line, install." -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uinaf — export · repo OG card</title>
<link rel="stylesheet" href="../dist/css/tokens.css">
<style>body{margin:0;background:var(--bg, #0a0a0a)}</style>
</head>
<body class="uinaf">
<div class="uinaf" style="width:1280px;height:640px;position:relative;overflow:hidden;box-sizing:border-box">
<div class="u-ticks" style="position:absolute;inset:28px;border:1px solid var(--border)"></div>
<div style="position:absolute;inset:28px;display:flex;align-items:center;gap:72px;padding:0 88px;box-sizing:border-box">
<div style="flex:1;display:flex;flex-direction:column;gap:28px;min-width:0">
<span class="u-label" style="font-size:20px">github.com / uinaf</span>
<span style="font-size:88px;line-height:1.1;color:var(--fg);letter-spacing:-0.01em">healthd</span>
<span style="font-size:28px;line-height:1.45;color:var(--fg-muted);max-width:24ch;text-wrap:pretty">pluggable host health check daemon in Go.</span>
<span style="display:inline-flex;align-self:flex-start;align-items:center;background:var(--neutral-925);border:1px solid var(--border);border-radius:2px;padding:16px 24px;font-size:24px;color:var(--fg);margin-top:8px"><span style="color:var(--fg-subtle);margin-right:16px">$</span>brew install uinaf/tap/healthd</span>
</div>
<img src="https://cdn.uinaf.dev/images/uinaf-computer.png" alt="" style="width:340px;height:340px;border:1px solid var(--neutral-900);flex:none;display:block">
</div>
</div>
</body></html>
