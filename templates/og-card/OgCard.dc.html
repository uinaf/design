<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="og / social card" description="1200×630 open-graph image: tagline left, framed artwork right." -->
<helmet>
<script src="./ds-base.js"></script>
<style>body{margin:0;background:rgb(10,10,10)}</style>
</helmet>
<div class="uinaf" style="width:1200px;height:630px;position:relative;overflow:hidden;box-sizing:border-box">
<div class="u-ticks" style="position:absolute;inset:28px;border:1px solid rgb(38,38,38)"></div>
<div style="position:absolute;inset:28px;display:flex;align-items:center;gap:64px;padding:0 72px;box-sizing:border-box">
<div style="flex:1;display:flex;flex-direction:column;gap:24px;min-width:0">
<span class="u-label" style="font-size:18px">undefined is not a function llc</span>
<span style="font-size:64px;line-height:1.2;color:rgb(229,229,229);letter-spacing:-0.01em;text-wrap:pretty">we bet you've seen us before.</span>
<span style="font-size:22px;color:rgb(82,82,82)">uinaf.dev</span>
</div>
<img src="../../assets/uinaf-team.png" alt="" style="width:400px;height:400px;border:1px solid rgb(23,23,23);flex:none;display:block">
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630}}"></script>
</body>
</html>
