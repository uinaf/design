<!doctype html>
<!-- @template name="export · readme banner" description="2560×568 thin banner for the top of a README: mark, repo name, description, and an install line. The status layout is kept in a comment. Mirrors readmeBanner() on uinaf.dev." -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uinaf — export · readme banner</title>
<link rel="stylesheet" href="../dist/css/tokens.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body class="uinaf">
<div class="uinaf" style="width:2560px;height:568px;position:relative;overflow:hidden;box-sizing:border-box">
<div class="u-ticks" style="position:absolute;inset:40px;border:1px solid var(--border)"></div>
<div style="position:absolute;inset:40px;display:flex;align-items:center;gap:80px;padding:0 104px;box-sizing:border-box">
<img src="https://cdn.uinaf.dev/images/uinaf-computer.png" alt="" style="width:280px;height:280px;border:1px solid var(--neutral-900);flex:none;display:block">
<div style="display:flex;flex-direction:column;gap:24px;min-width:0">
<span style="font-size:120px;line-height:1;color:var(--fg);letter-spacing:-0.01em">ffss</span>
<span style="font-size:36px;color:var(--fg-muted)">the flipflopslopstack.</span>
<span style="display:flex;font-size:32px;color:var(--fg-subtle);margin-top:8px"><span style="margin-right:38px">$</span><span>brew install --cask uinaf/tap/slopguard</span></span>
</div>

<div style="display:flex;flex-direction:column;gap:20px;min-width:0">
<span style="font-size:120px;line-height:1;color:var(--fg);letter-spacing:-0.01em">design</span>
<span style="font-size:36px;color:var(--fg-muted)">uinaf design tokens, CSS primitives, and guide.</span>
</div>
<div style="flex:1"></div>
<div style="display:flex;flex-direction:column;gap:22px;align-items:flex-end;font-size:30px;color:var(--fg-subtle);flex:none">
<span style="display:inline-flex;align-items:center;gap:18px"><i class="u-dot u-dot--live" style="width:14px;height:14px"></i>package&nbsp;&nbsp;@uinaf/design</span>
<span>surface&nbsp;&nbsp;design.uinaf.dev</span>
<span>license&nbsp;&nbsp;mit</span>
</div>
-->
</div>
</div>
</body></html>
