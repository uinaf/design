<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uinaf — panel-grid</title>
<link rel="stylesheet" href="https://design.uinaf.dev/tokens.css">
</head>
<body class="uinaf">
<!-- In your project: @import "@uinaf/design/css"; then copy the markup below. -->
<div class="u-panel-grid" style="grid-template-columns:repeat(3,1fr)">
<div class="u-stat"><span class="u-label">reviews today</span><span class="u-stat-value">128</span></div>
<div class="u-stat"><span class="u-label">median turnaround</span><span class="u-stat-value">3m 12s</span></div>
<div class="u-stat"><span class="u-label">queue</span><span class="u-stat-value">7</span><span class="u-stat-note">PRs waiting</span></div>
</div>
</body>
</html>
