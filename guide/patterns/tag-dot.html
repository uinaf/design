<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uinaf — tag+dot</title>
<link rel="stylesheet" href="https://design.uinaf.dev/tokens.css">
</head>
<body class="uinaf">
<!-- In your project: @import "@uinaf/design/css"; then copy the markup below. -->
<span class="u-tag"><span class="u-dot u-dot--ok"></span>pass</span>
<span class="u-tag"><span class="u-dot u-dot--warn"></span>flaky</span>
<span class="u-tag"><span class="u-dot u-dot--error"></span>fail</span>
<span class="u-tag"><span class="u-dot u-dot--live"></span>running</span>
</body>
</html>
