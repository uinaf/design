<nav class="guide-bar" aria-label="guide">
  <a href="/">← design</a>
  <span class="sep">·</span>

<div class="u-label">checkbox — .u-check</div>
<div style="display:flex;flex-wrap:wrap;gap:12px 32px">
<label class="u-check"><input type="checkbox" checked>review on push</label>
<label class="u-check"><input type="checkbox">draft PRs too</label>
<label class="u-check"><input type="checkbox" disabled>forks (soon)</label>
</div>
<div class="u-label">radio — .u-check + type="radio"</div>
<div style="display:flex;flex-wrap:wrap;gap:12px 32px">
<label class="u-check"><input type="radio" name="r" checked>one review per PR</label>
<label class="u-check"><input type="radio" name="r">re-review every push</label>
</div>
<div class="u-label">switch — .u-switch</div>
<div style="display:flex;flex-wrap:wrap;gap:12px 32px">
<label class="u-switch"><input type="checkbox" checked>inline findings</label>
<label class="u-switch"><input type="checkbox">weekly digest</label>
<label class="u-switch"><input type="checkbox" disabled>telepathy</label>
</div>
<p class="u-meta">input first, label right. a checked group counts as the surface's one accent.</p>
