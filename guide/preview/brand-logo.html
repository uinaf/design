<!doctype html>
<!-- @dsCard group="Brand" name="Logo lockup" subtitle="Framed mark, black only, never recolored" viewport="720x520" -->
<html lang="en"><head>
<meta charset="utf-8">
<title>uinaf — logo</title>
<link rel="stylesheet" href="/tokens.css">
<style>html,body{margin:0;padding:0}body.uinaf{padding:32px 36px;display:flex;gap:32px;align-items:flex-start}.main img{width:220px;height:220px;border:1px solid var(--neutral-900);display:block}.side{display:flex;flex-direction:column;gap:16px}.side .row{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--fg-subtle)}.side img{border:1px solid var(--neutral-900);display:block}.rules{font-size:11px;color:var(--fg-muted);display:flex;flex-direction:column;gap:var(--sp-1);margin-top:8px}.rules s{color:var(--fg-faint)}</style>
<!-- guide-chrome -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="https://cdn.uinaf.dev/images/uinaf-computer.png" type="image/png" />
<style id="guide-chrome">
  html { background: var(--bg, #0a0a0a); }
  body.uinaf {
    box-sizing: border-box;
    max-width: 48rem;
    margin-inline: auto;
    min-height: 100vh;
  }
  .guide-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 16px;
    margin: 0 0 8px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border, #222);
    font-size: 13px;
  }
  .guide-bar a {
    color: var(--fg-muted, #888);
    text-decoration: none;
  }
  .guide-bar a:hover { color: var(--accent, #b6ff3c); }
  .guide-bar .sep { color: var(--fg-faint, #555); }
  .guide-bar .title { color: var(--fg, #ddd); }
  .guide-bar .sub { color: var(--fg-subtle, #777); font-size: 11px; }
</style>
</head><body class="uinaf">
<nav class="guide-bar" aria-label="guide">
  <a href="/">← design</a>
  <span class="sep">·</span>
  <span class="u-label">Brand</span>
  <span class="sep">·</span>
  <span class="title">Logo lockup</span>
  <span class="sub">Framed mark, black only, never recolored</span>
</nav>

<div class="main u-ticks"><img src="https://cdn.uinaf.dev/images/uinaf-team.png" alt="uinaf primary mark"></div>
<div class="side">
<span class="u-label">primary mark · 220–240px</span>
<div class="row"><img src="https://cdn.uinaf.dev/images/uinaf-computer.png" width="64" height="64" alt="">64 · secondary</div>
<div class="row"><img src="https://cdn.uinaf.dev/images/uinaf-computer.png" width="32" height="32" alt="">32 · favicon</div>
<div class="row"><span style="font-size:16px;color:var(--fg)">uinaf</span>text wordmark, lowercase</div>
<div class="rules"><span>✓ pure black behind, 1px frame, square crop</span><span><s>✗ never rotate, recolor, or gradient-fill</s></span><span><s>✗ never on a non-black background</s></span></div>
</div>
</body></html>
